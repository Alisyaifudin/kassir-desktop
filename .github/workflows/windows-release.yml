name: "Publish Windows App"

on:
  push:
    branches:
      - master
    # A docs-only push must not kick off a build. CI config is deliberately *not*
    # in this list: a change to this file is a change to how releases are built,
    # and it has to be able to trigger the run that exercises it — ignoring
    # `.github/**` meant a workflow fix could never run, so `master` sat on a
    # version with no installer. Deliberate re-builds still belong to the manual
    # dispatch below.
    paths-ignore:
      - "**/*.md"
  # Manual "Run workflow" button. GitHub only offers this trigger for workflows
  # that exist on the default branch, so this file lives on master -- the ref
  # dropdown can then build any branch, e.g. run it against `prod` to produce the
  # installer for that branch's package.json version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update. Empty = v<version from package.json>."
        required: false
        default: ""
      draft:
        description: "Create the release as a draft (safer: review before publishing)."
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      # Fail fast on a red tree: `tauri build` runs `bun run build`, which runs
      # `tsc`, so a type error used to surface only inside the installer build.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # A red test suite must not hold the installer hostage: the build is the
      # deliverable, and a failing test is a report, not a shipping decision.
      # The step still turns the run's annotation red (so a red suite is never
      # silent), but the job carries on into `Build and Release`. Typecheck and
      # Lint stay blocking — those two *are* the build's own preconditions.
      - name: Unit tests
        run: bun test
        continue-on-error: true

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
        # This forces the action to use Bun instead of pnpm
          tauriScript: bun tauri
          # `v__VERSION__` is replaced by tauri-action with the version from
          # package.json; an explicit input wins for manual runs.
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: "Release ${{ inputs.tag || 'v__VERSION__' }}"
          releaseBody: "Windows version of the app"
          # push -> always draft (previous behaviour); dispatch -> as requested.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft == 'true' }}
          prerelease: false

  # The Rust side is otherwise only compiled as a side effect of `tauri build`,
  # so a type error surfaced minutes into the MSI build on Windows. This job
  # compiles (and lints) the crate on every push, in well under two minutes with
  # the cache. The Linux target is the honest gate here: `printer.rs`'s Windows
  # branch is `#[cfg(windows)]` and cannot be checked on ubuntu — the release job
  # below still compiles it.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # `validate_pdf` (the only place IPC-supplied bytes cross into Rust) and
      # the bcrypt round-trip used to be compile-checked only.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Tier-0 end-to-end: the real router in Chromium against sql.js, running the
  # real migrations (`bun run test:e2e`). Blocking: the harness applies the real
  # migrations and rings up a real sale, so a service-layer regression that the
  # unit tests miss (a migration that does not apply, a cart that stops writing)
  # fails here instead of at the till.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e
