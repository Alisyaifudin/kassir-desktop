name: "Publish Windows App"

on:
  push:
    branches:
      - master
    # A CI-config or docs-only push must not kick off a build: the version in
    # package.json is already released, so tauri-action would target an existing
    # tag/release. Installer builds should be deliberate (see workflow_dispatch).
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  # Manual "Run workflow" button. GitHub only offers this trigger for workflows
  # that exist on the default branch, so this file lives on master -- the ref
  # dropdown can then build any branch, e.g. run it against `prod` to produce the
  # installer for that branch's package.json version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update. Empty = v<version from package.json>."
        required: false
        default: ""
      draft:
        description: "Create the release as a draft (safer: review before publishing)."
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
        # This forces the action to use Bun instead of pnpm
          tauriScript: bun tauri
          # `v__VERSION__` is replaced by tauri-action with the version from
          # package.json; an explicit input wins for manual runs.
          tagName: ${{ inputs.tag || 'v__VERSION__' }}
          releaseName: "Release ${{ inputs.tag || 'v__VERSION__' }}"
          releaseBody: "Windows version of the app"
          # push -> always draft (previous behaviour); dispatch -> as requested.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft == 'true' }}
          prerelease: false
