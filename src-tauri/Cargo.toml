[package]
name = "kassir"
version = "6.7.7"
description = "kassir-desktop"
authors = ["Muhammad Ali Syaifudin"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kassir_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[features]
default = []
# Dev-only automation bridge (see src-tauri/src/lib.rs). Off by default so the
# plugin crate is not compiled or linked into a release binary; `bun run
# tauri:dev` enables it.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
tauri-plugin-prevent-default = "4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
bcrypt = "0.17"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-fs = "2"
tempfile = "3"
tauri-plugin-dialog = "2"
# One process per machine: the app preloads a fixed `sqlite:data.db` and keeps the
# cart and the catalogue in process-local refs, so a second launch would write
# over the first one's state from a stale snapshot.
tauri-plugin-single-instance = "2"
tauri-plugin-mcp-bridge = { version = "0.13.1", optional = true }

[target.'cfg(windows)'.dependencies]
winprint = "0.2.0"
